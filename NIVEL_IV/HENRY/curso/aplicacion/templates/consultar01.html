{% include 'encabezado.html' %}
<div>
    <div class="row">
        <div class="mb-3 mt-3 col-md-6">
            <label for="cedula" class="form-label">Cédula:</label>
            <input type="text" class="form-control" id="cedula" name="cedula" value="{{cedula}}" readonly>
        </div>
        <div class="mb-3 mt-3 col-md-6">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre"  name="nombre" value="{{nombre}}" readonly>
        </div>
    </div>
    <div class="row">
        <div class="mb-3 mt-3 col-md-6">
            <label for="apellido" class="form-label">Apellido:</label>
            <input type="text" class="form-control" id="apellido"  name="apellido" value="{{apellido}}" readonly>
        </div>
        <div class="mb-3 mt-3 col-md-6">
            <label for="fechanac" class="form-label">Fecha de nacimiento:</label>
            <input type="text" class="form-control" id="fechanac"  name="fechanac" value="{{fechanac}}" readonly>
        </div>
    </div>
    <div class="mb-3 mt-3">
        <label for="direccion" class="form-label">Dirección:</label>
        <textarea class="form-control" name="direccion" id="direccion" cols="30" rows="2" readonly>{{direccion}}</textarea>
    </div>
</div>
