{% include 'encabezado.html' %}
<form action="/persona_actualizar02/" method="post">
    {% csrf_token %}
    <div class="row">
        <div class="mb-3 mt-3 col-md-6">
            <label for="cedula" class="form-label">Cédula:</label>
            <input type="text" class="form-control" id="cedula" name="cedula" value="{{cedula}}" readonly>
        </div>
        <div class="mb-3 mt-3 col-md-6">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre"  name="nombre" value="{{nombre}}" required>
        </div>
    </div>
    <div class="row">
        <div class="mb-3 mt-3 col-md-6">
            <label for="apellido" class="form-label">Apellido:</label>
            <input type="text" class="form-control" id="apellido"  name="apellido" value="{{apellido}}" required>
        </div>
        <div class="mb-3 mt-3 col-md-6">
            <label for="fechanac" class="form-label">Fecha de nacimiento:</label>
            <input type="date" class="form-control" id="fechanac"  name="fechanac" value="{{fechanac}}" required>
        </div>
    </div>
    <div class="mb-3 mt-3">
        <label for="direccion" class="form-label">Dirección:</label>
        <textarea class="form-control" name="direccion" id="direccion" cols="30" rows="2" required>{{direccion}}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">GUARDAR CAMBIOS</button>
    <input type="hidden" name="id" value="{{id}}">
</form>
{% include 'pie.html' %}
