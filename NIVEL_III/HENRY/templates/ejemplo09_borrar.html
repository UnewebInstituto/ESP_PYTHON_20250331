{% include 'ejemplo09_encabezado.html' %}
<div class="table-responsive">
    <table class="table table-striped table-bordered table-hover">
        <thead>
            <tr>
                <th>Id</th>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fecha nacimiento</th>
                <th>Dirección</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for cedula, nombre, apellido, direccion, fechanac, id in detalle %}
            <tr>
                <td>{{id}}</td>
                <td>{{cedula}}</td>
                <td>{{nombre}}</td>
                <td>{{apellido}}</td>
                <td>{{fechanac}}</td>
                <td>{{direccion}}</td>
                <td><a href="{{ url_for('borrar01', tmp_id=id) }}" class="btn btn-warning">Borrar</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
